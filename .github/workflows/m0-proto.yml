name: M0 Proto

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: Buf lint
        run: buf lint
      - name: Buf breaking baseline
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/Voivox/voivox-proto.git#branch=main"
